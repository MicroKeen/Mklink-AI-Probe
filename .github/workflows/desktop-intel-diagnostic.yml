name: Intel desktop packaging diagnostics
on:
  push:
    branches: [codex/v033-intel-dmg-diagnostics]
    paths: ['.github/workflows/desktop-intel-diagnostic.yml']
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed source commit to package (40-character SHA)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: Mklink-AI-Probe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit || '11616f8077c469c83f0b82de0de5b0f12098c960' }}
          persist-credentials: false
      - name: Verify exact source identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || '11616f8077c469c83f0b82de0de5b0f12098c960' }}
        run: |
          if ($env:SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'An exact source SHA is required' }
          if ((git rev-parse HEAD) -ne $env:SOURCE_COMMIT) { throw 'Source identity mismatch' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.0'
          cache: false
      - name: Native dependencies
        run: |
          brew install libusb
          rustup update stable --no-self-update
          ./scripts/build_workspace.ps1 -Action run -Executable python -ArgumentList @('-m', 'pip', 'install', '.[gui,mcp]', 'pyinstaller==6.18.0', 'pytest==8.4.2')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/build_workspace.ps1 -Action run -WorkingDirectory ./gui -Executable npm -ArgumentList @('ci')
      - name: Build exact source with verbose packaging output
        run: |
          $driver = Join-Path (Split-Path (Get-Location)) '.build/artifacts/intel-diagnostic-driver.py'
          New-Item -ItemType Directory -Force -Path (Split-Path $driver) | Out-Null
          @'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'skills/tauri-gui-builder/scripts'))
          import build_unix
          original_run = build_unix.builder.run
          def verbose_run(cmd, *args, **kwargs):
              if cmd == ['npx', 'tauri', 'build']:
                  cmd = [*cmd, '--verbose']
              return original_run(cmd, *args, **kwargs)
          build_unix.builder.run = verbose_run
          build_unix.main()
          '@ | Set-Content -LiteralPath $driver -Encoding UTF8
          ./scripts/build_workspace.ps1 -Action run -Executable python -ArgumentList @($driver)
      - name: Qualify frozen backend and package
        run: ./scripts/build_workspace.ps1 -Action run -Executable python -ArgumentList @('_maintainer/testing/desktop_unix_smoke.py', 'x86_64-apple-darwin')
      - name: Upload packages and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mklink-v0.3.3-x86_64-apple-darwin
          path: |
            .build/artifacts/x86_64-apple-darwin
            .build/reports
            .build/cache/cargo/release/bundle/dmg/bundle_dmg.sh
          if-no-files-found: warn
          retention-days: 30
