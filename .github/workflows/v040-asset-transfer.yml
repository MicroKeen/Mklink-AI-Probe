name: Transfer qualified 0.4.0 release assets
on:
  push:
    branches: [codex/v040-asset-transfer]
    paths: [.github/workflows/v040-asset-transfer.yml, Mklink-AI-Probe/_maintainer/release/transfer_v040_assets.py]
permissions:
  contents: write
concurrency:
  group: v040-qualified-asset-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'MicroKeen/Mklink-AI-Probe' && github.actor == 'Aladdin-Wang'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Transfer existing bytes with pinned hashes
        run: python3 Mklink-AI-Probe/_maintainer/release/transfer_v040_assets.py
        env:
          GH_TOKEN: ${{ github.token }}
